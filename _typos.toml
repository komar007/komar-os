files.extend-exclude = [
  # SOPS secrets with a lot of base64-encoded encrypted data
  "machines/*/secrets.yaml",
  "homes/*/secrets.yaml",
]

[default]
extend-ignore-re = [
  # explicit whole-line ignore
  '''(?m)^.*# typos:ignore-line$''',
]

[default.extend-identifiers]
mosquitto = "mosquitto"
LESS_TERMCAP_ue = "LESS_TERMCAP_ue"
